<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fully rounded background -->
  <circle cx="100" cy="100" r="100" fill="#1a1a2e"/>
  
  <!-- Glow effect circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#pGradient)" stroke-width="2" opacity="0.3" filter="url(#pGlow)"/>
  
  <!-- Styled P -->
  <g filter="url(#pGlow)">
    <!-- Vertical bar of P -->
    <rect x="50" y="40" width="28" height="120" fill="url(#pGradient)" rx="14"/>
    
    <!-- Top rounded part of P -->
    <path d="M 78 40 Q 120 40 120 70 Q 120 100 78 100 L 78 40" fill="url(#pGradient)"/>
    
    <!-- Accent shine -->
    <ellipse cx="65" cy="55" rx="10" ry="12" fill="white" opacity="0.3"/>
  </g>
</svg>
